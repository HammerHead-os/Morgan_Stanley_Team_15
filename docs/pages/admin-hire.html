<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hire enquiries (staff) | Love 21</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/modal.css" />
    <!-- PostHog Analytics -->
    <script src="../js/posthog.js"></script>
  </head>
  <body>
    <nav class="site-nav" aria-label="Primary">
      <div class="inner">
        <a class="brand" href="../index.html">
          <img class="brand-logo" src="../assets/media/love21-logo.png" alt="Love 21" width="120" height="74" />
        </a>
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="nav-menu"
        >
          Menu
        </button>
        <ul class="nav-links" id="nav-menu">
          <li><a href="../index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="impact.html">Donations</a></li>
          <li><a class="nav-session" data-session href="profile.html">…</a></li>
        </ul>
      </div>
    </nav>

    <header class="page-banner">
      <div class="container">
        <p class="eyebrow">Staff only</p>
        <h1>Hire enquiries</h1>
        <p>Every "hire a creator" request submitted on Explore, in one place.</p>
      </div>
    </header>

    <main>
      <section class="section section-tight">
        <div class="container">
          <div data-admin-hire-list><p class="empty-hint">Loading…</p></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-bottom">
        <span>© Love 21 Foundation · Hackathon demo for Code to Give 2026</span>
        <a href="../index.html">Back to home</a>
      </div>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/modal-kit.js"></script>
    <script src="../js/app.js"></script>
    <script>
      (async function () {
        const L = window.Love21;
        const box = document.querySelector("[data-admin-hire-list]");

        // Every field below (requester_name, company_name, event_description,
        // contact info) came from a PUBLIC, unauthenticated form — POST /api/hire
        // accepts an optional_person, so anyone can submit an enquiry. Never
        // interpolate that text into innerHTML without escaping it first, or a
        // malicious enquiry becomes a stored XSS payload that fires in a staff
        // member's logged-in session the moment they open this page.
        function escapeHtml(s) {
          return String(s == null ? "" : s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function fmtDate(iso) {
          try {
            return new Date(iso).toLocaleDateString();
          } catch (e) {
            return "";
          }
        }

        try {
          const person = await L.requireLogin(function (p) {
            return p;
          });
          const isAdmin =
            person && Array.isArray(person.roles) && person.roles.indexOf("admin") !== -1;
          if (!isAdmin) {
            box.innerHTML = '<p class="empty-hint">Staff access only.</p>';
            return;
          }
          const rows = await L.api("/api/hire/admin");
          box.innerHTML = rows.length
            ? '<div style="overflow-x:auto"><table class="admin-table"><thead><tr>' +
              "<th>Date</th><th>Requester</th><th>Company</th><th>Creator</th><th>Event</th><th>Preferred date</th><th>Contact</th>" +
              "</tr></thead><tbody>" +
              rows
                .map(function (r) {
                  return (
                    "<tr><td>" +
                    escapeHtml(fmtDate(r.created_at)) +
                    "</td><td>" +
                    escapeHtml(r.requester_name) +
                    "</td><td>" +
                    escapeHtml(r.company_name) +
                    "</td><td>" +
                    escapeHtml(r.creator_label) +
                    "</td><td>" +
                    escapeHtml(r.event_description) +
                    "</td><td>" +
                    escapeHtml(r.preferred_date || "") +
                    "</td><td>" +
                    escapeHtml(r.contact_email || r.contact_phone || "") +
                    "</td></tr>"
                  );
                })
                .join("") +
              "</tbody></table></div>"
            : '<p class="empty-hint">No enquiries yet.</p>';
        } catch (err) {
          box.innerHTML = '<p class="empty-hint">' + escapeHtml(L.friendlyError(err)) + "</p>";
        }
      })();
    </script>
  </body>
</html>
