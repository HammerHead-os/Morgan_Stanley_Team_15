<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Activate your account | Love 21</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <!-- PostHog Analytics -->
    <script src="../js/posthog.js"></script>
  </head>
  <body>
    <nav class="site-nav" aria-label="Primary">
      <div class="inner">
        <a class="brand" href="../index.html">
          <img class="brand-logo" src="../assets/media/love21-logo.png" alt="Love 21" width="120" height="74" />
        </a>
        <ul class="nav-links">
          <li><a href="../index.html">Home</a></li>
        </ul>
      </div>
    </nav>

    <header class="page-banner">
      <div class="container">
        <p class="eyebrow">Welcome</p>
        <h1>Activate your account</h1>
        <p>Set a password to finish creating your Love 21 login.</p>
      </div>
    </header>

    <main>
      <section class="section section-tight">
        <div class="container" style="max-width: 32rem">
          <div class="panel-soft stack">
            <p class="muted" data-claim-intro>Checking your invite…</p>
            <form class="contact-form stack" data-claim-form hidden>
              <label>
                Password
                <input type="password" name="password" minlength="6" required autocomplete="new-password" />
              </label>
              <label>
                Confirm password
                <input type="password" name="password2" minlength="6" required autocomplete="new-password" />
              </label>
              <p style="color: #b23b3b; font-size: 0.85rem; margin: 0" data-claim-error></p>
              <button type="submit" class="btn btn-primary">Activate account</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-bottom">
        <span>© Love 21 Foundation · Hackathon demo for Code to Give 2026</span>
        <a href="../index.html">Back to home</a>
      </div>
    </footer>

    <script src="../js/api.js"></script>
    <script>
      (function () {
        const L = window.Love21;
        const intro = document.querySelector("[data-claim-intro]");
        const form = document.querySelector("[data-claim-form]");
        const errEl = document.querySelector("[data-claim-error]");
        const code = new URLSearchParams(location.search).get("code");

        if (!code) {
          intro.textContent = "This link is missing an invite code.";
          return;
        }
        intro.textContent = "Set a password to activate your account.";
        form.hidden = false;

        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          errEl.textContent = "";
          const password = form.password.value;
          const password2 = form.password2.value;
          if (password !== password2) {
            errEl.textContent = "Passwords don't match.";
            return;
          }
          try {
            const data = await L.api("/api/auth/claim", {
              method: "POST",
              body: { code: code, password: password },
            });
            L.setSession(data.token, data.person);
            L.showToast("Account activated");
            location.href = "profile.html";
          } catch (err) {
            errEl.textContent = L.friendlyError(err);
          }
        });
      })();
    </script>
  </body>
</html>
