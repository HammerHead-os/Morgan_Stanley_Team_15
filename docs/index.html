<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Love 21 Foundation</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="page-arrival">
    <nav class="site-nav" aria-label="Primary">
      <div class="inner">
        <a class="brand" href="index.html">
          <span class="brand-mark" aria-hidden="true">21</span>
          Love 21
        </a>
        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="nav-menu"
        >
          Menu
        </button>
        <ul class="nav-links" id="nav-menu">
          <li>
            <a class="nav-home" href="index.html" aria-current="page">Home</a>
          </li>
          <li><a href="pages/profile.html">Profile</a></li>
          <li><a href="pages/about.html">About</a></li>
          <li><a href="pages/contact.html">Contact</a></li>
        </ul>
      </div>
    </nav>

    <header class="arrival" id="start">
      <div class="container arrival-inner">
        <p class="arrival-brand">Love <span>21</span></p>
        <h1>Who are you here as?</h1>
        <p class="arrival-lead">
          Sport, nutrition, and support for Hong Kong’s Down syndrome,
          autistic, and neurodiverse community. Pick your role — we’ll show
          only what you need.
        </p>

        <div class="role-grid role-grid-main" data-role-grid>
          <button type="button" class="role-option" data-role="family">
            <span class="role-label">Parent / carer</span>
            <span class="role-hint">Find a class for your child</span>
          </button>
          <button type="button" class="role-option" data-role="donor">
            <span class="role-label">Donor</span>
            <span class="role-hint">Give monthly · see the impact</span>
          </button>
          <button type="button" class="role-option" data-role="volunteer">
            <span class="role-label">Volunteer</span>
            <span class="role-hint">Short tasks · log hours</span>
          </button>
          <button type="button" class="role-option" data-role="company">
            <span class="role-label">Company / CSR</span>
            <span class="role-hint">Hire talent · team days · in-kind</span>
          </button>
        </div>

        <div class="journey-preview" data-journey-preview hidden></div>
      </div>
    </header>

    <footer class="site-footer site-footer-compact">
      <div class="footer-bottom" style="border: 0; margin: 0; padding: 1.25rem 0">
        <span>Love 21 · San Po Kong</span>
        <span>
          <a href="pages/about.html">About</a>
          ·
          <a href="pages/contact.html">Contact</a>
          ·
          <a href="pages/transparency.html">Where money goes</a>
        </span>
      </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/home.js"></script>
  </body>
</html>
